server:
  port: 8081
  error:
    include-message: always


spring:
  application:
    name: PracticasJhos

  flyway:
    enabled: true
    baseline-version: 1
    locations:
      classpath: db/migration
    sql-migration-suffixes: .sql
    baseline-on-migrate: true
    sql-migration-prefix: V
    schemas: public

  datasource:
    url: jdbc:postgresql://localhost:5432/PracticaJhos
    username: postgres
    password: 0150561991
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
      format_sql: true